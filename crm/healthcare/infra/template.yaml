AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Healthcare CRM app stack - Lambda function, log group and Cognito role groups. Uses the building blocks in /infra.

Parameters:
  ExportPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]*'
    Description: Same prefix as the infra building blocks of this deployment, for example healthcare-crm-prod.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/index.ts]
    Properties:
      CodeUri: ../backend
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME:
            Fn::ImportValue: !Sub ${ExportPrefix}-data-TableName
          AUDIT_TABLE_NAME:
            Fn::ImportValue: !Sub ${ExportPrefix}-audit-TableName
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
              Resource:
                - Fn::ImportValue: !Sub ${ExportPrefix}-data-TableArn
                - !Sub
                  - ${TableArn}/index/GSI1
                  - TableArn:
                      Fn::ImportValue: !Sub ${ExportPrefix}-data-TableArn
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource:
                Fn::ImportValue: !Sub ${ExportPrefix}-audit-TableArn
            - Effect: Allow
              Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey*, kms:DescribeKey]
              Resource:
                Fn::ImportValue: !Sub ${ExportPrefix}-DataKeyArn

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 365
      KmsKeyId:
        Fn::ImportValue: !Sub ${ExportPrefix}-DataKeyArn

  GroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolId
      GroupName: admin
      Description: Tenant administrator
  GroupClinician:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolId
      GroupName: clinician
      Description: Clinical staff
  GroupStaff:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolId
      GroupName: staff
      Description: Front desk / care coordination
  GroupBilling:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolId
      GroupName: billing
      Description: Billing, demographics read-only

Outputs:
  FunctionArn:
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub ${ExportPrefix}-FunctionArn
