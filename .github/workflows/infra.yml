name: infra

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']

permissions:
  contents: read

jobs:
  lint:
    name: lint ${{ matrix.block }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add a new block here when you add a folder under infra/.
        block: [cognito-user-pool, dynamodb-table, github-oidc-role, http-api-jwt, kms-data-key]
    env:
      BLOCK: ${{ matrix.block }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx run cfn-lint "infra/$BLOCK/template.yaml"
