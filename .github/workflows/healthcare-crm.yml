name: healthcare-crm

on:
  push:
    branches: [main]
    paths: ['templates/healthcare-crm/**', '.github/workflows/healthcare-crm.yml']
  pull_request:
    paths: ['templates/healthcare-crm/**', '.github/workflows/healthcare-crm.yml']
  # Deploying is a manual run: Actions tab, healthcare-crm, Run workflow. You type these in each time.
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS region, for example us-east-1'
        required: true
        type: string
      frontend_origin:
        description: 'Web address the app will be served from, for example https://crm.example.com'
        required: true
        type: string
      aws_deploy_role_arn:
        description: 'ARN of the role GitHub assumes to deploy (created by infra/github-oidc-role)'
        required: true
        type: string
      stack_prefix:
        description: 'Name shared by every stack of this deployment'
        required: true
        default: healthcare-crm-prod
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: 'templates/healthcare-crm/**/package-lock.json' }
      - run: pipx run cfn-lint "templates/healthcare-crm/infra/*/template.yaml"
      - run: npm ci && npm run typecheck && npm test
        working-directory: templates/healthcare-crm/backend
      - run: npm ci && npm run typecheck
        working-directory: templates/healthcare-crm/frontend

  deploy:
    needs: test
    # Only runs when someone starts it by hand on main, so pushes and pull requests never try to deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS: no long-lived AWS keys in GitHub
    environment: production # add required reviewers in repo settings
    defaults:
      run:
        working-directory: templates/healthcare-crm
    env:
      # Inputs go through env, not straight into the shell script, so their text is never run as code.
      PREFIX: ${{ inputs.stack_prefix }} # shared by every infra stack of this deployment (see infra/README.md)
      FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      AWS_REGION_NAME: ${{ inputs.aws_region }}
      ROLE_ARN: ${{ inputs.aws_deploy_role_arn }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$AWS_REGION_NAME" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || fail "aws_region does not look like a region, for example us-east-1"
          [[ "$PREFIX" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "stack_prefix may use lowercase letters, digits and hyphens only"
          [[ "$FRONTEND_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || fail "frontend_origin must be an https address with no path, for example https://crm.example.com"
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || fail "aws_deploy_role_arn does not look like an IAM role ARN"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.aws_deploy_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy the infra stacks and the app stack
        run: |
          deploy() { # stack suffix, template file, extra parameters
            local name=$1 template=$2; shift 2
            aws cloudformation deploy --stack-name "$PREFIX-$name" --template-file "$template" \
              --no-fail-on-empty-changeset --parameter-overrides ExportPrefix="$PREFIX" "$@"
          }
          deploy kms infra/kms-data-key/template.yaml
          deploy data infra/dynamodb-table/template.yaml TableLabel=data Stage=prod EnableGsi=true
          deploy audit infra/dynamodb-table/template.yaml TableLabel=audit Stage=prod
          deploy auth infra/cognito-user-pool/template.yaml
          (cd backend && npm ci)
          sam build -t infra/app/template.yaml
          sam deploy --stack-name "$PREFIX-app" --resolve-s3 --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset --no-confirm-changeset \
            --parameter-overrides ExportPrefix="$PREFIX"
          deploy api infra/http-api-jwt/template.yaml AllowedOrigin="$FRONTEND_ORIGIN"

      - name: Read stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$PREFIX-$1" \
            --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          echo "VITE_API_URL=$(out api ApiUrl)" >> "$GITHUB_ENV"
          echo "VITE_USER_POOL_ID=$(out auth UserPoolId)" >> "$GITHUB_ENV"
          echo "VITE_USER_POOL_CLIENT_ID=$(out auth UserPoolClientId)" >> "$GITHUB_ENV"

      - name: Lock CSP to this deployment's origins
        working-directory: templates/healthcare-crm/frontend
        run: |
          sed -i "s|__API_ORIGIN__|$VITE_API_URL|; s|__COGNITO_ORIGIN__|https://cognito-idp.${AWS_REGION_NAME}.amazonaws.com|" public/_headers

      - name: Build frontend
        working-directory: templates/healthcare-crm/frontend
        run: npm ci && npm run build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: templates/healthcare-crm/frontend
          command: deploy
