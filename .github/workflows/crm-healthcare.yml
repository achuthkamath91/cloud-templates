name: crm-healthcare

on:
  push:
    branches: [main]
    paths: ['crm/healthcare/**', '.github/workflows/crm-healthcare.yml']
  pull_request:
    paths: ['crm/healthcare/**', '.github/workflows/crm-healthcare.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: 'crm/healthcare/**/package-lock.json' }
      - run: pipx run cfn-lint crm/healthcare/infra/template.yaml
      - run: npm ci && npm run typecheck && npm test
        working-directory: crm/healthcare/backend
      - run: npm ci && npm run typecheck
        working-directory: crm/healthcare/frontend

  deploy:
    needs: test
    # Skipped until the repo variable FRONTEND_ORIGIN is set, so forks and fresh clones do not show a failed deploy.
    if: github.ref == 'refs/heads/main' && vars.FRONTEND_ORIGIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS: no long-lived AWS keys in GitHub
    environment: production # add required reviewers in repo settings
    defaults:
      run:
        working-directory: crm/healthcare
    env:
      STACK: healthcare-crm-prod
      # Repo variables go through env, not straight into the shell script, so their text is never run as code.
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      AWS_REGION_NAME: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Backend deploy (SAM)
        run: |
          (cd backend && npm ci)
          sam build -t infra/template.yaml
          sam deploy --stack-name "$STACK" --resolve-s3 --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset --no-confirm-changeset \
            --parameter-overrides Stage=prod AllowedOrigin="$FRONTEND_ORIGIN"

      - name: Read stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "VITE_API_URL=$(out ApiUrl)" >> "$GITHUB_ENV"
          echo "VITE_USER_POOL_ID=$(out UserPoolId)" >> "$GITHUB_ENV"
          echo "VITE_USER_POOL_CLIENT_ID=$(out UserPoolClientId)" >> "$GITHUB_ENV"

      - name: Lock CSP to this deployment's origins
        working-directory: crm/healthcare/frontend
        run: |
          sed -i "s|__API_ORIGIN__|$VITE_API_URL|; s|__COGNITO_ORIGIN__|https://cognito-idp.${AWS_REGION_NAME}.amazonaws.com|" public/_headers

      - name: Build frontend
        working-directory: crm/healthcare/frontend
        run: npm ci && npm run build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crm/healthcare/frontend
          command: deploy
