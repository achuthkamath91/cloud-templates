<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare CRM</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1d21; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
      form { display: grid; gap: 8px; margin: 16px 0; }
      input, select, button { font: inherit; padding: 8px 10px; border: 1px solid #c8ccd2; border-radius: 6px; }
      button { background: #0b5fff; color: #fff; border-color: #0b5fff; cursor: pointer; }
      button.secondary { background: #fff; color: #1a1d21; border-color: #c8ccd2; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e4e6ea; }
      .err { color: #b00020; }
      .row { display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
