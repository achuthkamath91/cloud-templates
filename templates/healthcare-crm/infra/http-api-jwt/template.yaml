AWSTemplateFormatVersion: '2010-09-09'
Description: HTTP API with a Cognito JWT authorizer in front of one Lambda function

Parameters:
  ExportPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]*'
    Description: Names this deployment, for example healthcare-crm-prod. Must match the cognito-user-pool stack and the app stack that exports FunctionArn.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: The one web origin allowed to call this API from a browser (CORS), for example https://crm.example.com.
  ThrottlingRateLimit:
    Type: Number
    Default: 25
    Description: Steady requests per second, shared by all callers.
  ThrottlingBurstLimit:
    Type: Number
    Default: 50
    Description: Short burst allowance in requests.

Resources:
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref ExportPrefix
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 600

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolClientId
        Issuer: !Sub
          - https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}
          - PoolId:
              Fn::ImportValue: !Sub ${ExportPrefix}-UserPoolId

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::ImportValue: !Sub ${ExportPrefix}-FunctionArn
      PayloadFormatVersion: '2.0'

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'ANY /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub ${ExportPrefix}-FunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
